services:
  - type: web
    name: goonbet
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: FOOTBALL_DATA_API_TOKEN
        sync: false
      - key: FOOTBALL_DATA_COMPETITION
        value: WC
      - key: ODDS_PROVIDER
        value: pinnacle_guest
      - key: PINNACLE_WORLD_CUP_LEAGUE_ID
        value: "2686"
      - key: PINNACLE_USE_PUBLIC_CONFIG
        value: "true"
      - key: THE_ODDS_API_KEY
        sync: false
      - key: ODDS_API_SPORT_KEY
        value: soccer_fifa_world_cup
      - key: ODDS_API_REGIONS
        value: eu
      - key: ODDS_API_BOOKMAKERS
        value: pinnacle
      - key: ENABLE_FUTURES
        value: "true"
      - key: ODDS_API_OUTRIGHTS_SPORT_KEY
        sync: false
      - key: ODDS_API_WINNER_SPORT_KEY
        sync: false
      - key: ODDS_API_TOP_SCORER_SPORT_KEY
        sync: false
      - key: ODDS_API_FUTURES_REGIONS
        sync: false
      - key: ODDS_API_FUTURES_BOOKMAKERS
        sync: false
      - key: ODDS_API_EVENT_MARKET_MATCH_LIMIT
        value: "6"
      - key: TOURNAMENT_SPECIALS_LOCK_TIME
        value: "2026-07-01T12:00:00Z"
      - key: MATCH_LOOKAHEAD_DAYS
        value: "7"
      - key: MATCH_CACHE_TTL_SECONDS
        value: "10800"
      - key: FUTURE_CACHE_TTL_SECONDS
        value: "43200"
